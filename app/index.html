<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#6C5CE7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>EduQuest 🎮 - Aventura Învățării</title>
    <meta name="description" content="Platformă educațională gamificată pentru întreaga familie">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&subset=latin-ext&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/main.css">

    <style>
        /* Page-specific styles */
        .magic-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, #F8F9FE 0%, #E8ECFF 50%, #DDD6FE 100%);
            z-index: -1;
        }

        .magic-bg::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 10%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }

        .magic-bg::after {
            content: '';
            position: absolute;
            bottom: 30%;
            right: 15%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(245, 87, 108, 0.1) 0%, transparent 70%);
            animation: float 8s ease-in-out infinite reverse;
        }

        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0.6;
            animation: float 4s ease-in-out infinite;
        }

        .mascot {
            font-size: 5rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(108, 92, 231, 0.3));
        }

        .welcome-text {
            text-align: center;
            margin-bottom: var(--space-lg);
        }

        .welcome-text h2 {
            font-size: 1.1rem;
            color: var(--color-text-light);
            font-family: var(--font-primary);
            font-weight: 400;
        }

        .profile-card {
            position: relative;
            overflow: hidden;
        }

        .profile-card::after {
            content: '→';
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: var(--color-text-light);
            transition: transform var(--transition-normal);
        }

        .profile-card:hover::after {
            transform: translateY(-50%) translateX(5px);
        }

        .profiles {
            max-width: 360px;
            gap: var(--space-md);
        }

        .section-divider {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 360px;
            margin: var(--space-lg) 0;
            color: var(--color-text-light);
            font-size: 0.85rem;
        }

        .section-divider::before,
        .section-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 0, 0, 0.1);
        }

        .section-divider span {
            padding: 0 var(--space-md);
        }

        .admin-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: var(--space-sm) var(--space-md);
            background: rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-lg);
            color: var(--color-text-light);
            text-decoration: none;
            font-size: 0.85rem;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-normal);
        }

        .admin-link:hover {
            background: white;
            color: var(--color-primary);
            box-shadow: var(--shadow-md);
        }

        .parent-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: var(--space-sm) var(--space-md);
            background: rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-lg);
            color: var(--color-text-light);
            text-decoration: none;
            font-size: 0.85rem;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-normal);
        }

        .parent-link:hover {
            background: white;
            color: var(--color-primary);
            box-shadow: var(--shadow-md);
        }

        .grade-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(108, 92, 231, 0.15);
            color: var(--color-primary);
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: var(--space-sm);
        }

        .profile-selection {
            padding-bottom: 80px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            font-size: 2rem;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            border-radius: 50%;
        }

        .profile-info h3 {
            font-size: 1.2rem;
        }
    </style>
</head>

<body>
    <div class="magic-bg">
        <div class="sparkles">
            <span class="sparkle" style="top: 10%; left: 20%;">✨</span>
            <span class="sparkle" style="top: 30%; left: 80%; animation-delay: -1s;">⭐</span>
            <span class="sparkle" style="top: 60%; left: 15%; animation-delay: -2s;">🌟</span>
            <span class="sparkle" style="top: 80%; left: 70%; animation-delay: -0.5s;">💫</span>
        </div>
    </div>

    <div class="profile-selection">
        <!-- Logo & Mascot -->
        <div class="logo">
            <div class="mascot">🎓</div>
            <h1>EduQuest</h1>
            <p class="subtitle">Aventura Învățării</p>
        </div>

        <!-- Welcome Text -->
        <div class="welcome-text">
            <h2>Cine învață azi? 📚</h2>
        </div>

        <!-- Profile Cards - Kids -->
        <div class="profiles">
            <!-- Rebecca - Roblox mascot -->
            <div class="profile-card profile-card--rebecca" onclick="selectProfile('rebecca')">
                <div class="avatar avatar--rebecca" title="Rebecca's Roblox Avatar">
                    <img src="images/mascots/Re_Roblox.png" alt="Rebecca" onerror="this.parentElement.innerHTML='🎮'">
                </div>
                <div class="profile-info">
                    <h3>Rebecca <span class="grade-badge">Clasa IV</span></h3>
                    <p>🔧 Exploratoare Tehnică</p>
                </div>
            </div>

            <!-- Brianna - Roblox mascot -->
            <div class="profile-card profile-card--brianna" onclick="selectProfile('brianna')">
                <div class="avatar avatar--brianna" title="Brianna's Roblox Avatar">
                    <img src="images/mascots/Bri_Roblox.png" alt="Brianna" onerror="this.parentElement.innerHTML='🎮'">
                </div>
                <div class="profile-info">
                    <h3>Brianna <span class="grade-badge">Clasa II</span></h3>
                    <p>🎨 Artistă Creativă</p>
                </div>
            </div>
        </div>

        <!-- Divider -->
        <div class="section-divider">
            <span>👨‍👩‍👧‍👧 Familia</span>
        </div>

        <!-- Profile Cards - Adults -->
        <div class="profiles">
            <!-- Tata -->
            <div class="profile-card profile-card--tata" onclick="selectProfile('tata')">
                <div class="avatar avatar--tata">
                    👨‍💻
                </div>
                <div class="profile-info">
                    <h3>Tata <span class="grade-badge">Avansat</span></h3>
                    <p>💻 AHK, C++, Python, Engleză</p>
                </div>
            </div>

            <!-- Mama/Nicoleta -->
            <div class="profile-card profile-card--nicoleta" onclick="selectProfile('nicoleta')">
                <div class="avatar avatar--nicoleta">
                    👩‍🎓
                </div>
                <div class="profile-info">
                    <h3>Nicoleta <span class="grade-badge">Clasa a XII-a seral</span></h3>
                    <p>📖 Mat, Ro, En, Fr, It, Ist, Geo</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Access -->
    <a href="admin/login.html" class="admin-link">
        🔐 Admin
    </a>

    <!-- Parent Dashboard -->
    <a href="parent/index.html" class="parent-link">
        📊 Rapoarte
    </a>

    <script>
        // Profile selection
        function selectProfile(profile) {
            // Store selected profile
            localStorage.setItem('eduquest_profile', profile);
            localStorage.setItem('eduquest_login_time', new Date().toISOString());

            // Add selection animation
            const selectedClass = profile === 'nicoleta' ? 'nicoleta' : profile;
            const card = document.querySelector(`.profile-card--${selectedClass}`);
            card.style.transform = 'scale(0.95)';
            card.style.boxShadow = '0 0 30px rgba(108,92,231,0.4)';

            // Navigate to dashboard
            setTimeout(() => {
                window.location.href = `dashboard.html?user=${profile}`;
            }, 300);
        }

        // Add entrance animation and reset pointer events
        window.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.profile-card').forEach((card, index) => {
                // Reset pointer events in case we're coming back from another page
                card.style.pointerEvents = 'auto';
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.4s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 200 + (index * 100));
            });
        });

        // Service Worker registration for PWA (future)
        if ('serviceWorker' in navigator) {
            // navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>

</html>
