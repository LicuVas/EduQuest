<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQuest - Reset Progress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&subset=latin-ext&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .reset-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .user-list {
            text-align: left;
            margin: 20px 0;
        }
        .user-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .user-item input {
            margin-right: 15px;
            width: 20px;
            height: 20px;
        }
        .user-info {
            flex: 1;
        }
        .user-name {
            font-weight: 600;
            color: #333;
        }
        .user-stats {
            font-size: 0.85rem;
            color: #666;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }
        .success-message {
            display: none;
            background: #27ae60;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <h1>Reset Progres</h1>
        <p class="subtitle">Selectează membrii familiei pentru care vrei să resetezi progresul</p>

        <div class="user-list" id="userList">
            <!-- Users will be loaded here -->
        </div>

        <div>
            <button class="btn btn-secondary" onclick="selectAll()">Selectează Tot</button>
            <button class="btn btn-danger" onclick="resetSelected()">Resetează Selectați</button>
        </div>

        <div class="success-message" id="successMessage">
            Progresul a fost resetat cu succes!
        </div>

        <a href="../index.html" class="back-link">← Înapoi la pagina principală</a>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/firebase-sync.js"></script>
    <script>
        // Load users with cloud data
        async function loadUsers() {
            const container = document.getElementById('userList');
            container.innerHTML = '<div style="text-align:center;padding:20px;">Se încarcă datele...</div>';

            let html = '';
            for (const [id, profile] of Object.entries(PROFILES)) {
                // Try cloud first, fallback to local
                let stats, quests;
                if (window.FirebaseSync && FirebaseSync.isOnline()) {
                    stats = await FirebaseSync.getStats(id);
                    quests = await FirebaseSync.getQuests(id);
                } else {
                    stats = getStats(id);
                    quests = getUserQuests(id);
                }

                const completedQuests = quests.filter(q => q.completed).length;

                html += `
                    <label class="user-item">
                        <input type="checkbox" name="user" value="${id}">
                        <div class="user-info">
                            <div class="user-name">${profile.avatarEmoji} ${profile.name}</div>
                            <div class="user-stats">
                                XP: ${stats.totalPoints || 0} |
                                Streak: ${stats.streak || 0} zile |
                                Misiuni: ${completedQuests}/${quests.length}
                            </div>
                        </div>
                    </label>
                `;
            }
            container.innerHTML = html;
        }

        function selectAll() {
            document.querySelectorAll('input[name="user"]').forEach(cb => cb.checked = true);
        }

        async function resetSelected() {
            const selected = Array.from(document.querySelectorAll('input[name="user"]:checked'))
                .map(cb => cb.value);

            if (selected.length === 0) {
                alert('Selectează cel puțin un utilizator!');
                return;
            }

            if (!confirm(`Ești sigur că vrei să resetezi progresul pentru: ${selected.join(', ')}?\n\nAceastă acțiune va șterge datele de pe TOATE dispozitivele!`)) {
                return;
            }

            // Reset both local and cloud
            for (const userId of selected) {
                if (window.FirebaseSync && FirebaseSync.isOnline()) {
                    await FirebaseSync.resetUser(userId);
                } else {
                    resetUserProgress(userId);
                }
            }

            // Also clear current profile if it's one of the reset users
            const currentProfile = localStorage.getItem('eduquest_profile');
            if (selected.includes(currentProfile)) {
                localStorage.removeItem('eduquest_profile');
            }

            document.getElementById('successMessage').style.display = 'block';
            await loadUsers(); // Refresh stats
        }

        // Initialize after Firebase loads
        setTimeout(loadUsers, 1000);
    </script>
</body>
</html>
