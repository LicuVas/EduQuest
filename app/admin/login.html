<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EduQuest - Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&subset=latin-ext&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        body {
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--space-xxl);
            width: 90%;
            max-width: 360px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .login-icon {
            font-size: 4rem;
            margin-bottom: var(--space-lg);
        }

        .login-title {
            font-size: 1.5rem;
            color: var(--color-text);
            margin-bottom: var(--space-md);
        }

        .login-subtitle {
            color: var(--color-text-light);
            margin-bottom: var(--space-xl);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: var(--space-lg);
            text-align: left;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: var(--space-sm);
            color: var(--color-text);
        }

        .form-input {
            width: 100%;
            padding: var(--space-md);
            border: 2px solid #e0e0e0;
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .error-msg {
            color: var(--color-error);
            font-size: 0.85rem;
            margin-top: var(--space-sm);
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .back-link {
            display: inline-block;
            margin-top: var(--space-lg);
            color: var(--color-text-light);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--color-primary);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-icon">🔐</div>
        <h1 class="login-title">Acces Administrator</h1>
        <p class="login-subtitle">Dashboard pentru monitorizare și rapoarte</p>

        <form onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Utilizator</label>
                <select class="form-input" id="username" required>
                    <option value="">Selectează...</option>
                    <option value="tata">Tata</option>
                    <option value="mama">Mama</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Parola</label>
                <input type="password" class="form-input" id="password" placeholder="Introduceți parola" required>
                <div class="error-msg" id="errorMsg">Parolă incorectă!</div>
            </div>

            <button type="submit" class="btn btn--primary btn--block">
                Intră în Dashboard
            </button>
        </form>

        <a href="../index.html" class="back-link">← Înapoi la EduQuest</a>
    </div>

    <script>
        const ADMIN_PASSWORD = 'raport';

        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (password === ADMIN_PASSWORD) {
                // Store admin session
                localStorage.setItem('eduquest_admin', username);
                localStorage.setItem('eduquest_admin_time', new Date().toISOString());

                // Redirect to admin dashboard
                window.location.href = 'dashboard.html';
            } else {
                // Show error
                document.getElementById('errorMsg').classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }

            return false;
        }

        // Check if already logged in
        const adminUser = localStorage.getItem('eduquest_admin');
        const adminTime = localStorage.getItem('eduquest_admin_time');
        if (adminUser && adminTime) {
            const hoursSince = (Date.now() - new Date(adminTime)) / (1000 * 60 * 60);
            if (hoursSince < 24) {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>

</html>
