    <style>
        .quests-header {
            background: var(--gradient-primary);
            color: white;
            padding: var(--space-lg);
            text-align: center;
        }

        .quests-header h1 {
            font-size: 1.8rem;
            margin-bottom: var(--space-sm);
        }

        .filter-tabs {
            display: flex;
            gap: var(--space-sm);
            padding: var(--space-md);
            overflow-x: auto;
            background: var(--color-card);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .filter-tab {
            padding: var(--space-sm) var(--space-md);
            background: var(--color-bg);
            border: none;
            border-radius: var(--radius-xl);
            font-family: var(--font-primary);
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--transition-fast);
        }

        .filter-tab--active {
            background: var(--color-primary);
            color: white;
        }

        .filter-tab:hover:not(.filter-tab--active) {
            background: var(--color-primary-light);
            color: white;
        }

        .quests-container {
            padding: var(--space-md);
            padding-bottom: 100px;
        }

        .subject-section {
            margin-bottom: var(--space-xl);
        }

        .subject-header {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-md);
        }

        .subject-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .subject-icon--romana {
            background: rgba(255, 107, 107, 0.2);
        }

        .subject-icon--matematica {
            background: rgba(78, 205, 196, 0.2);
        }

        .subject-icon--engleza {
            background: rgba(69, 183, 209, 0.2);
        }

        .subject-icon--bonus {
            background: rgba(249, 202, 36, 0.2);
        }

        .subject-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .subject-progress {
            margin-left: auto;
            font-size: 0.85rem;
            color: var(--color-text-light);
        }

        .difficulty-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: var(--space-sm);
        }

        .difficulty-badge--easy {
            background: rgba(0, 184, 148, 0.2);
            color: #00B894;
        }

        .difficulty-badge--medium {
            background: rgba(253, 203, 110, 0.2);
            color: #D68910;
        }

        .difficulty-badge--hard {
            background: rgba(225, 112, 85, 0.2);
            color: #E17055;
        }

        .empty-state {
            text-align: center;
            padding: var(--space-xxl);
            color: var(--color-text-light);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: var(--space-md);
        }

        .refresh-btn {
            position: fixed;
            bottom: 80px;
            right: var(--space-md);
            width: 56px;
            height: 56px;
            background: var(--gradient-primary);
            border: none;
            border-radius: var(--radius-round);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: all var(--transition-normal);
        }

        .refresh-btn:hover {
            transform: scale(1.1) rotate(180deg);
        }
    </style>
</head>

        const SUBJECT_ICONS = {

            franceza: '🇫🇷',
            italiana: '🇮🇹',
            istorie: '🏛️',
            geografie: '🌍'
        };

        const SUBJECT_NAMES = {
            romana: 'Limba Română',
            matematica: 'Matematică',
            engleza: 'Limba Engleză',
            bonus: 'Bonus & Fun',
            autohotkey: 'AutoHotkey',
            english_grammar: 'English Grammar',
            cpp: 'C++ Programming',
            python: 'Python',
            informatica: 'Informatică',

            italiana: 'Limba Italiană',
            istorie: 'Istorie',
            geografie: 'Geografie'
        };

        let currentFilter = 'all';
        let currentQuests = [];

        function currentUserId() {
            return new URLSearchParams(window.location.search).get('user')
                || localStorage.getItem('eduquest_profile') || 'rebecca';
        }

        function questsStorageKey(userId) {
            return `eduquest_quests_${userId}`;
        }

        function questsDateKey(userId) {
            return `eduquest_quests_date_${userId}`;
        }

        function profileSubjects(userId) {
            const templates = QUEST_TEMPLATES[userId] || {};
            return Object.keys(templates).filter(s => s !== 'bonus');
        }

        function renderFilters(userId) {
            const tabs = document.getElementById('filterTabs');
            if (!tabs) return;
            const subjects = profileSubjects(userId);
            tabs.innerHTML = `<button class="filter-tab filter-tab--active" data-filter="all">Toate</button>` +
                subjects.map(s => `<button class="filter-tab" data-filter="${s}">${SUBJECT_ICONS[s] || ''} ${SUBJECT_NAMES[s] || s}</button>`).join('');
            tabs.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const active = tabs.querySelector('.filter-tab--active');
                    if (active) active.classList.remove('filter-tab--active');
                    tab.classList.add('filter-tab--active');
                    currentFilter = tab.dataset.filter;
                    renderQuests();
                });
            });
        }

        // Generate daily quests
        function generateDailyQuests() {
            const userId = currentUserId();
            const templates = QUEST_TEMPLATES[userId] || QUEST_TEMPLATES.rebecca;
            const quests = [];
            let id = 1;

            // Generate 1-2 quests per subject
            Object.keys(templates).forEach(subject => {
                const subjectQuests = templates[subject];
                const count = subject === 'bonus' ? 1 : 2;

                // Random selection
                const shuffled = [...subjectQuests].sort(() => 0.5 - Math.random());
                shuffled.slice(0, count).forEach(template => {
                    quests.push({
                        id: id++,
                        subject: subject,
                        ...template,
                        completed: false
                    });
                });
            });

            return quests;
        }

        // Load or generate quests — cheie localStorage per profil
        function loadQuests() {
            const userId = currentUserId();
            localStorage.setItem('eduquest_profile', userId);
            renderFilters(userId);

            const today = new Date().toDateString();
            const savedDate = localStorage.getItem(questsDateKey(userId));

            if (savedDate === today) {
                const saved = localStorage.getItem(questsStorageKey(userId));
                if (saved) {
                    currentQuests = JSON.parse(saved);
                    renderQuests();
                    return;
                }
            }

            // Generate new quests for today
            currentQuests = generateDailyQuests();
            localStorage.setItem(questsStorageKey(userId), JSON.stringify(currentQuests));
            localStorage.setItem(questsDateKey(userId), today);
            renderQuests();
        }

        // Render quests
        function renderQuests() {
            const container = document.getElementById('questsContainer');
            const filteredQuests = currentFilter === 'all'
                ? currentQuests
                : currentQuests.filter(q => q.subject === currentFilter);

            if (filteredQuests.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🎉</div>
                        <h3>Nu sunt misiuni!</h3>
                        <p>Ai completat totul sau nu există misiuni în această categorie.</p>
                    </div>
                `;
                return;
            }

            // Group by subject
            const grouped = {};
            filteredQuests.forEach(quest => {
                if (!grouped[quest.subject]) {
                    grouped[quest.subject] = [];
                }
                grouped[quest.subject].push(quest);
            });

            let html = '';
            Object.keys(grouped).forEach(subject => {
                const subjectQuests = grouped[subject];
                const completed = subjectQuests.filter(q => q.completed).length;

                html += `
                    <div class="subject-section">
                        <div class="subject-header">
                            <div class="subject-icon subject-icon--${subject}">
                                ${SUBJECT_ICONS[subject]}
                            </div>
                            <span class="subject-title">${SUBJECT_NAMES[subject]}</span>
                            <span class="subject-progress">${completed}/${subjectQuests.length}</span>
                        </div>
                        <div class="quest-list">
                            ${subjectQuests.map(quest => renderQuestCard(quest)).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Render single quest card
        function renderQuestCard(quest) {
            const difficultyLabels = {
                easy: 'Ușor',
                medium: 'Mediu',
                hard: 'Greu'
            };

            return `
                <div class="quest-card quest-card--${quest.subject}" onclick="startQuest(${quest.id})">
                    <div class="quest-icon quest-icon--${quest.subject}">
                        ${SUBJECT_ICONS[quest.subject]}
                    </div>
                    <div class="quest-info">
                        <div class="quest-title">
                            ${quest.title}
                            <span class="difficulty-badge difficulty-badge--${quest.difficulty}">
                                ${difficultyLabels[quest.difficulty]}
                            </span>
                        </div>
                        <div class="quest-meta">
                            <span class="quest-points">+${quest.points} ⭐</span>
                            <span>~${quest.duration} min</span>
                        </div>
                    </div>
                    <div class="quest-status ${quest.completed ? 'quest-status--completed' : ''}">
                        ${quest.completed ? '✓' : ''}
                    </div>
                </div>
            `;
        }

        // Start a quest
        function startQuest(questId) {
            const userId = currentUserId();
            const quest = currentQuests.find(q => q.id === questId);
            if (quest) {
                localStorage.setItem('eduquest_current_quest', JSON.stringify(quest));
                window.location.href = `exercise.html?quest=${questId}&user=${userId}`;
            }
        }

        // Generate new quests (refresh button)
        function generateNewQuests() {
            if (confirm('Vrei să generezi misiuni noi pentru azi?')) {
                const userId = currentUserId();
                localStorage.removeItem(questsStorageKey(userId));
                localStorage.removeItem(questsDateKey(userId));
                loadQuests();
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadQuests);
    </script>
</body>

</html>
